name: Update Stock News

on:
  schedule:
    - cron: '0 */1 * * *'  # runs every 1 hour
  workflow_dispatch:  # lets you also trigger it manually from GitHub

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run news fetch script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node fetchNews.js

      - name: Commit and push updated posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Auto-update news" || echo "No changes to commit"
          git push